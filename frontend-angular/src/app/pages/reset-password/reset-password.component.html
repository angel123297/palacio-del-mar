<div class="reset-container">
  <div class="reset-card" [ngClass]="status()">
    
    <div class="icon-container" *ngIf="status() !== 'form'">
      <i class="fa-solid" 
         [ngClass]="{
           'fa-spinner fa-spin': status() === 'loading',
           'fa-check-circle': status() === 'success',
           'fa-times-circle': status() === 'error'
         }"></i>
    </div>

    <!-- Header -->
    <div class="card-header" *ngIf="status() === 'form'">
      <span class="gold-subtitle">Palacio del Mar • Seguridad</span>
      <h1 class="title">Nueva Contraseña</h1>
      <p class="subtitle">Ingresa tu nueva clave de acceso para continuar disfrutando de tu cuenta.</p>
    </div>

    <!-- Mensaje de error general si aplica -->
    <div *ngIf="errorMessage()" class="alert-error" role="alert">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span>{{ errorMessage() }}</span>
    </div>

    <!-- Formulario de reseteo -->
    <form *ngIf="status() === 'form'" (ngSubmit)="submitReset()" class="reset-form">
      <div class="form-group">
        <label for="newPassword">Nueva Contraseña</label>
        <div class="input-wrapper">
          <input 
            [type]="showPassword() ? 'text' : 'password'"
            id="newPassword" 
            [(ngModel)]="newPassword" 
            name="newPassword"
            required 
            minlength="6"
            placeholder="Mínimo 6 caracteres"
            [disabled]="isSubmitting()"
            autocomplete="new-password"
          />
          <button type="button" class="btn-toggle-eye" (click)="toggleShowPassword()" aria-label="Mostrar u ocultar contraseña">
            <i class="fa-solid" [ngClass]="showPassword() ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Nueva Contraseña</label>
        <div class="input-wrapper">
          <input 
            [type]="showPassword() ? 'text' : 'password'"
            id="confirmPassword" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword"
            required 
            minlength="6"
            placeholder="Repite tu nueva contraseña"
            [disabled]="isSubmitting()"
            autocomplete="new-password"
          />
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn-gold" [disabled]="isSubmitting()">
          <i class="fa-solid fa-spinner fa-spin" *ngIf="isSubmitting()"></i>
          <span>{{ isSubmitting() ? 'Actualizando...' : 'Guardar Nueva Contraseña' }}</span>
        </button>
      </div>
    </form>

    <!-- Estado Éxito -->
    <div *ngIf="status() === 'success'" class="success-state">
      <h1 class="title">¡Contraseña Actualizada!</h1>
      <p class="message">{{ message() }}</p>
      <div class="actions">
        <a routerLink="/" class="btn-gold">Iniciar Sesión en Palacio del Mar →</a>
      </div>
    </div>

    <!-- Estado Error de Token o Carga -->
    <div *ngIf="status() === 'error'" class="error-state">
      <h1 class="title">Enlace No Válido</h1>
      <p class="message">{{ message() }}</p>
      <div class="actions">
        <a routerLink="/" class="btn-gold">Volver al Inicio</a>
      </div>
    </div>

  </div>
</div>
