name: Mobile App Build (Flutter Android & Web)

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'app/**'
    paths:
      - 'mobile-flutter/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile-flutter
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: mobile-flutter
        run: flutter test

      - name: Build Android APK
        working-directory: mobile-flutter
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: palacio-del-mar-android-apk
          path: mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
