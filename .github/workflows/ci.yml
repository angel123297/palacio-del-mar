name: Continuous Integration - Palacio del Mar

on:
  push:
    branches:
      - main
      - plan/marketplace-webhooks
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - plan/marketplace-webhooks

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests & Coverage (Spring Boot 3 / Java 21)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x backend-java/mvnw

      - name: Generate isolated test credentials
        shell: bash
        run: |
          for key in JWT_SECRET PALACIO_PROXY_TOKEN PAYMENTS_WEBHOOK_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done

      - name: Run Backend Tests & Generate Coverage (JaCoCo)
        working-directory: backend-java
        env:
          MONGO_HOST: localhost
          REDIS_HOST: localhost
        run: ./mvnw -B verify

      - name: Upload JaCoCo Code Coverage Report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend-java/target/site/jacoco/
          retention-days: 14

  frontend:
    name: Frontend Build & Lint (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832e0b1 # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend-angular
        run: npm ci --legacy-peer-deps

      - name: Build Angular Application
        working-directory: frontend-angular
        run: npm run build

      - name: Run Frontend Unit Tests
        working-directory: frontend-angular
        run: npm test -- --watch=false
