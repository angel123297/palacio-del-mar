name: palacio-del-mar

services:
  # --- Base de datos MongoDB -------------------------------------------------
  mongo:
    image: mongo:7
    container_name: palacio-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Backend Java (Spring Boot 3 / Java 21) --------------------------------
  backend-java:
    build: ./backend-java
    container_name: palacio-backend-java
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGO_HOST: mongo
      MONGODB_URI: mongodb://mongo:27017/palacio_db
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/palacio_db
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env (copia .env.example)}
      JWT_EXPIRATION: "604800000"
      # Solo desarrollo local: habilita el botón "Verificar ahora" (force-verify). En otros entornos definir APP_DEV_FORCE_VERIFY_ENABLED=false
      APP_DEV_FORCE_VERIFY_ENABLED: "${APP_DEV_FORCE_VERIFY_ENABLED:-true}"
      SERVER_PORT: "5000"
      SPRING_MAIL_HOST: "${SPRING_MAIL_HOST:-mailpit}"
      SPRING_MAIL_PORT: "${SPRING_MAIL_PORT:-1025}"
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME:-}"
      SPRING_MAIL_PASSWORD: "${SPRING_MAIL_PASSWORD:-}"
      SPRING_MAIL_AUTH: "${SPRING_MAIL_AUTH:-false}"
      SPRING_MAIL_STARTTLS: "${SPRING_MAIL_STARTTLS:-false}"
      SPRING_MAIL_STARTTLS_REQUIRED: "${SPRING_MAIL_STARTTLS_REQUIRED:-false}"
      SPRING_MAIL_FROM: "${SPRING_MAIL_FROM:-reservas@palaciodelmar.co}"
      SPRING_CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Servidor de Caché Redis -----------------------------------------------
  redis:
    image: redis:alpine
    container_name: palacio-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Mailpit (Servidor SMTP de pruebas) -------------------------------------
  mailpit:
    image: axllent/mailpit
    container_name: palacio-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500

  # --- Frontend Angular -------------------------------------------------------
  web-angular:
    build: ./frontend-angular
    container_name: palacio-web-angular
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend-java

volumes:
  mongo-data:
  redis-data:
