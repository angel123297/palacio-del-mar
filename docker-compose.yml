name: palacio-del-mar

services:
  # --- Base de datos MongoDB -------------------------------------------------
  mongo:
    image: mongo:7
    container_name: palacio-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Backend Java (Spring Boot 3 / Java 21) --------------------------------
  backend-java:
    build: ./backend-java
    container_name: palacio-backend-java
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/palacio_db
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/palacio_db
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env (copia .env.example)}
      JWT_EXPIRATION: "604800000"
      SERVER_PORT: "5000"
    depends_on:
      mongo:
        condition: service_healthy

  # --- Frontend Angular 18 ----------------------------------------------------
  web-angular:
    build: ./frontend-angular
    container_name: palacio-web-angular
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend-java

volumes:
  mongo-data:
