services:
  mongo:
    image: mongo:7
    container_name: palacio-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: palacio_db
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: palacio-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/palacio_db
      MONGODB_TLS: "false"
      JWT_SECRET: ${JWT_SECRET:-secreto_de_desarrollo_cambiar_en_produccion}
    depends_on:
      mongo:
        condition: service_healthy
  web:
    build: ./frontend
    container_name: palacio-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
