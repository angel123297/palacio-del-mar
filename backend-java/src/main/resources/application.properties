spring.application.name=backend
server.port=${SERVER_PORT:5000}

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/palacio_db
spring.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/palacio_db
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET:local_development_secret_key_123456789012345678901234567890}
jwt.expiration=86400000

# Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Gemini API Key
gemini.api.key=${GEMINI_API_KEY:}

