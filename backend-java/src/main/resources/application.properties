spring.application.name=backend
server.port=${SERVER_PORT:5000}

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/palacio_db
spring.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/palacio_db
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET:super_secret_development_key_only_for_local_use_change_me_in_prod}
jwt.expiration=86400000

# Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Gemini API Key
gemini.api.key=${GEMINI_API_KEY:}

# Cache & Redis Configuration
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.redis.time-to-live=600000
