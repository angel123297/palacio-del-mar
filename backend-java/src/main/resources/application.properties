spring.application.name=backend
server.port=${SERVER_PORT:5000}
spring.main.allow-circular-references=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/palacio_db
spring.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/palacio_db
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Mail Configuration (SMTP Real con TLS — Gmail por defecto; compatible con Brevo y SendGrid)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.from=${SPRING_MAIL_FROM:palaciodelmar39@gmail.com}


# Cache & Redis Configuration
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.redis.time-to-live=600000

# Webhook & Simulated Payments Configuration
palacio.webhooks.payments.secret=${PAYMENTS_WEBHOOK_SECRET}
palacio.payments.simulation-delay-seconds=${PAYMENTS_SIMULATION_DELAY_SECONDS:2}

# Observability & Health Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=${MAIL_HEALTH_INDICATOR_ENABLED:false}

# Automated Schedulers & Dynamic Revenue Management
palacio.pricing.dynamic.enabled=${DYNAMIC_PRICING_ENABLED:true}
palacio.pricing.dynamic.surge-threshold=${DYNAMIC_PRICING_SURGE_THRESHOLD:0.75}
palacio.pricing.dynamic.surge-factor=${DYNAMIC_PRICING_SURGE_FACTOR:1.15}
palacio.pricing.dynamic.last-minute-factor=${DYNAMIC_PRICING_LAST_MINUTE_FACTOR:0.90}
palacio.payouts.check.interval.ms=${PAYOUTS_CHECK_INTERVAL_MS:3600000}
palacio.lifecycle.check.interval.ms=${LIFECYCLE_CHECK_INTERVAL_MS:60000}
palacio.lifecycle.autocheckin.hour=${LIFECYCLE_AUTOCHECKIN_HOUR:15}
palacio.lifecycle.autocheckout.hour=${LIFECYCLE_AUTOCHECKOUT_HOUR:13}
palacio.reviews.invitation.interval.ms=${REVIEWS_INVITATION_INTERVAL_MS:300000}
app.base-url=${APP_BASE_URL:http://localhost:4200}
palacio.security.proxy-token=${PALACIO_PROXY_TOKEN}

# Seed Configuration
admin.default.password=${ADMIN_DEFAULT_PASSWORD:Admin123456!}
app.seed-demo-data=${SEED_DEMO_DATA:false}


