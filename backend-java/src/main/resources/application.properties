spring.application.name=backend
server.port=${SERVER_PORT:5000}
spring.main.allow-circular-references=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/palacio_db
spring.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/palacio_db
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false


# Cache & Redis Configuration
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.redis.time-to-live=600000

# SOLO DESARROLLO: habilita POST /api/auth/force-verify (botón "Verificar ahora"). Nunca activar en producción.
app.dev.force-verify.enabled=${APP_DEV_FORCE_VERIFY_ENABLED:false}

# Webhook & Simulated Payments Configuration
palacio.webhooks.payments.secret=${PAYMENTS_WEBHOOK_SECRET:whsec_simulated_secret_key_palacio_2026}
palacio.payments.simulation-delay-seconds=${PAYMENTS_SIMULATION_DELAY_SECONDS:2}

# Observability & Health Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


