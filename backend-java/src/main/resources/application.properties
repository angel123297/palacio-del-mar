spring.application.name=backend
server.port=${SERVER_PORT:5000}
spring.main.allow-circular-references=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/palacio_db
spring.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/palacio_db
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Mail Configuration (Compatible con Gmail SMTP, Sendgrid y Mailpit)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.from=${SPRING_MAIL_FROM:reservas@palaciodelmar.co}


# Cache & Redis Configuration
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.redis.time-to-live=600000

# SOLO DESARROLLO: habilita POST /api/auth/force-verify (botón "Verificar ahora"). Nunca activar en producción.
app.dev.force-verify.enabled=${APP_DEV_FORCE_VERIFY_ENABLED:false}

# Webhook & Simulated Payments Configuration
palacio.webhooks.payments.secret=${PAYMENTS_WEBHOOK_SECRET:whsec_simulated_secret_key_palacio_2026}
palacio.payments.simulation-delay-seconds=${PAYMENTS_SIMULATION_DELAY_SECONDS:2}

# Observability & Health Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Automated Schedulers & Dynamic Revenue Management
palacio.pricing.dynamic.enabled=${DYNAMIC_PRICING_ENABLED:true}
palacio.pricing.dynamic.surge-threshold=${DYNAMIC_PRICING_SURGE_THRESHOLD:0.75}
palacio.pricing.dynamic.surge-factor=${DYNAMIC_PRICING_SURGE_FACTOR:1.15}
palacio.pricing.dynamic.last-minute-factor=${DYNAMIC_PRICING_LAST_MINUTE_FACTOR:0.90}
palacio.payouts.check.interval.ms=${PAYOUTS_CHECK_INTERVAL_MS:3600000}
palacio.lifecycle.check.interval.ms=${LIFECYCLE_CHECK_INTERVAL_MS:60000}
palacio.lifecycle.autocheckin.hour=${LIFECYCLE_AUTOCHECKIN_HOUR:15}
palacio.lifecycle.autocheckout.hour=${LIFECYCLE_AUTOCHECKOUT_HOUR:13}
palacio.reviews.invitation.interval.ms=${REVIEWS_INVITATION_INTERVAL_MS:300000}
app.base-url=${APP_BASE_URL:http://localhost:4200}


