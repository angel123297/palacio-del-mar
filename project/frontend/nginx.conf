# ============================================
# Palacio del Mar - nginx (frontend + proxy API)
# Equivale al antiguo .htaccess (cache, cabeceras, fallback a index.html)
# ============================================
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Igual que express.json({ limit: '10mb' }) en el backend
    client_max_body_size 10m;

    # DNS interno de Docker: nginx vuelve a resolver "backend" si el
    # contenedor se recrea, y arranca aunque el backend aún no exista.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # --- API: /api/* -> contenedor "backend" ---
    # ^~ evita que la regla de archivos estáticos capture rutas /api/...
    location ^~ /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # --- Archivos con hash (index-XXXX.js/css) e imágenes: caché de 1 año ---
    location ~* \.(?:js|css|jpe?g|png|gif|svg|webp|ico|woff2?)$ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html nunca se cachea (así los cambios de versión se ven al instante)
    location = /index.html {
        expires -1;
    }

    # --- React Router: cualquier otra ruta devuelve index.html ---
    location / {
        try_files $uri /index.html;
    }
}
